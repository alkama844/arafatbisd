<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#grid)" />
  <!-- Circuit Traces -->
  <g stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35">
    <path d="M 30 60 H 90 L 120 90 V 150" />
    <circle cx="30" cy="60" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    <circle cx="120" cy="150" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    
    <path d="M 180 30 V 90 L 210 120 H 270" />
    <circle cx="180" cy="30" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    <circle cx="270" cy="120" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    
    <path d="M 60 240 H 120 L 150 210 H 210 L 240 240 H 270" />
    <circle cx="60" cy="240" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    <circle cx="270" cy="240" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
    
    <path d="M 150 150 L 180 180 V 240" />
    <circle cx="150" cy="150" r="2.5" fill="#00f0ff" fill-opacity="0.6"/>
  </g>
</svg>
